<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Control Center - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Password Screen Modal -->
    <div id="login-modal" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-white text-slate-800 p-6 rounded-3xl max-w-sm w-full shadow-2xl text-center space-y-4">
            <h2 class="text-xl font-bold text-blue-900"><i class="fa-solid fa-lock"></i> Teacher Login</h2>
            <input type="password" id="admin-pin-input" placeholder="PIN દાખલ કરો (1234)..." class="w-full px-4 py-3 border rounded-xl text-center text-lg outline-none font-bold">
            <button onclick="verifyAdminPIN()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl text-sm">લોગિન કરો</button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard-content" class="hidden p-6 max-w-5xl mx-auto space-y-6">
        <div class="flex justify-between items-center border-b border-slate-700 pb-4">
            <h1 class="text-xl font-bold text-blue-400">Bharat Education Center - Admin Dashboard</h1>
            <button onclick="location.reload()" class="px-3 py-1 bg-rose-600 text-xs font-bold rounded-lg">લોગઆઉટ</button>
        </div>

        <!-- Pending Retake Requests Alert Section -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl space-y-3">
            <h3 class="font-bold text-amber-400 text-sm"><i class="fa-solid fa-bell"></i> Re-Test (Retry) રિક્વેસ્ટો:</h3>
            <div id="retake-requests-list" class="space-y-2 text-xs"></div>
        </div>

        <!-- Results Tracker & Printable Reports -->
        <div class="bg-white text-slate-800 p-5 rounded-2xl shadow-lg space-y-4">
            <div class="flex justify-between items-center no-print">
                <h3 class="font-bold text-slate-800">વિદ્યાર્થી રિઝલ્ટ રિપોર્ટ:</h3>
                <button onclick="window.print()" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl"><i class="fa-solid fa-print"></i> પ્રિન્ટ કરો</button>
            </div>

            <div id="printable-report">
                <div class="text-center mb-4 border-b pb-2 hidden print:block">
                    <h2 class="text-2xl font-bold text-blue-900">BHARAT EDUCATION CENTER</h2>
                    <p class="text-xs text-slate-600">Teacher: Chetan Soni | Exam Results</p>
                </div>
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 border-b">
                            <th class="p-2 border">તારીખ</th>
                            <th class="p-2 border">વિદ્યાર્થી</th>
                            <th class="p-2 border">ટેસ્ટ</th>
                            <th class="p-2 border">ગુણ</th>
                            <th class="p-2 border">સ્ટેટસ</th>
                            <th class="p-2 border no-print">એક્શન</th>
                        </tr>
                    </thead>
                    <tbody id="admin-results-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        function verifyAdminPIN() {
            const pin = document.getElementById('admin-pin-input').value;
            if(pin === "1234") {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                loadRetakeRequests();
                loadAdminResults();
            } else { alert("ખોટો PIN!"); }
        }

        async function loadRetakeRequests() {
            const container = document.getElementById('retake-requests-list');
            const { data } = await db.from('retake_requests').select('*').eq('status', 'pending');
            
            if(!data || data.length === 0) {
                container.innerHTML = "<p class='text-slate-400'>કોઈ નવી રિક્વેસ્ટ નથી.</p>";
                return;
            }

            container.innerHTML = data.map(r => `
                <div class="flex justify-between items-center bg-slate-700 p-2.5 rounded-xl">
                    <span><b>${r.student_name}</b> - ${r.test_name}</span>
                    <button onclick="approveRetake('${r.id}', '${r.student_name}', '${r.test_name}')" class="px-3 py-1 bg-emerald-600 text-white rounded-lg font-bold">Approve Retake</button>
                </div>
            `).join('');
        }

        async function approveRetake(reqId, student, test) {
            await db.from('results').update({ allow_retake: true }).eq('student_name', student).eq('test_name', test);
            await db.from('retake_requests').update({ status: 'approved' }).eq('id', reqId);
            alert('Re-Test મંજૂર થઈ ગયો છે!');
            loadRetakeRequests();
        }

        async function loadAdminResults() {
            const { data } = await db.from('results').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('admin-results-table');
            tbody.innerHTML = data.map(r => `
                <tr class="border-b">
                    <td class="p-2 border">${new Date(r.created_at).toLocaleDateString()}</td>
                    <td class="p-2 border font-bold">${r.student_name}</td>
                    <td class="p-2 border">${r.test_name}</td>
                    <td class="p-2 border">${r.score} (${r.percentage}%)</td>
                    <td class="p-2 border font-bold ${r.status === 'PASS' ? 'text-emerald-600' : 'text-rose-600'}">${r.status}</td>
                    <td class="p-2 border no-print">
                        <button onclick="deleteResult(${r.id})" class="px-2 py-1 bg-rose-100 text-rose-700 rounded font-bold">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteResult(id) {
            if(confirm('ડિલીટ કરવું છે?')) {
                await db.from('results').delete().eq('id', id);
                loadAdminResults();
            }
        }
    </script>
</body>
</html>
